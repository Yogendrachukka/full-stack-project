<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodBridge — Create account</title><link rel="stylesheet" href="/auth.css"></head>
<body><main><section class="brand"><a class="logo" href="/">Food<span>Bridge</span></a><div><div class="emoji">🤝</div><h1>Join the bridge.</h1><p>Donate food, receive food or volunteer to help your community.</p></div></section>
<section class="form"><a class="back" href="/">← Back home</a><h2>Create account</h2><p class="muted">Choose how you want to participate.</p><div id="msg"></div><form id="signup"><label>Name<input id="name" required placeholder="Your name or organization"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></label><label>Role<select id="role"><option value="DONOR">Food donor</option><option value="NGO">NGO / recipient</option><option value="VOLUNTEER">Volunteer</option></select></label><button>Create account</button></form><p class="switch">Already have an account? <a href="/login.html">Sign in</a></p></section></main>
<script>signup.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account...';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value,role:role.value})});const d=await r.json();if(r.ok)location.href='/login.html';else msg.textContent=d.message||'Registration failed';}</script></body></html>
