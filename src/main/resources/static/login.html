<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodBridge — Login</title><link rel="stylesheet" href="/auth.css"></head>
<body><main><section class="brand"><a class="logo" href="/">Food<span>Bridge</span></a><div><div class="emoji">🥗</div><h1>Welcome back.</h1><p>Sign in to help turn surplus food into meals for people who need them.</p></div></section>
<section class="form"><a class="back" href="/">← Back home</a><h2>Sign in</h2><p class="muted">Continue to your FoodBridge account.</p><div id="msg"></div><form id="login"><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required placeholder="Your password"></label><button>Sign in</button></form><p class="switch">Don't have an account? <a href="/signup.html">Create one</a></p></section></main>
<script>login.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok)location.href='/dashboard.html';else msg.textContent=d.message||'Login failed';}</script></body></html>
